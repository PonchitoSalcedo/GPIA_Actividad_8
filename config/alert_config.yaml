# ============================================
# CONFIGURACIÓN DE ALERTAS Y RUNBOOKS
# ============================================

# Alertas configuradas
alerts:
  performance_degradation:
    enabled: true
    severity: P1
    thresholds:
      rmse:
        value: 0.75
        condition: greater_than
      r2:
        value: 0.55
        condition: less_than
    actions:
      - execute_runbook: performance_degradation
    cooldown_minutes: 5

  latency_increase:
    enabled: true
    severity: P1
    thresholds:
      latency_p95:
        value: 0.05
        condition: greater_than
    actions:
      - execute_runbook: latency_increase
    cooldown_minutes: 3

  data_drift:
    enabled: true
    severity: P2
    thresholds:
      drift_score:
        value: 0.25
        condition: greater_than
    actions:
      - execute_runbook: data_drift
    cooldown_minutes: 15

  error_budget:
    enabled: true
    severity: P0
    thresholds:
      budget_consumed:
        value: 0.02
        condition: greater_than
    actions:
      - execute_runbook: error_budget
    cooldown_minutes: 1

# SLO Configuration
slo_config:
  rmse_max: 0.75
  r2_min: 0.55
  latency_p95_max: 0.05
  availability: 99.9
  error_budget: 0.02

# Runbooks Configuration
runbooks:
  performance_degradation:
    name: "Degradación del Rendimiento del Modelo"
    severity: P1
    estimated_time_minutes: 20
    
  latency_increase:
    name: "Aumento de Latencia en Inferencia"
    severity: P1
    estimated_time_minutes: 15
    
  data_drift:
    name: "Data Drift Detectado en Features"
    severity: P2
    estimated_time_minutes: 30
    
  error_budget:
    name: "Error Budget Agotado"
    severity: P0
    estimated_time_minutes: 60
